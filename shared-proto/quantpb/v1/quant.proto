// Copyright finance_next.
//
// Quant service contract between the Go gateway and the Python quant worker.
// This file is the SINGLE source of truth for the inter-service RPCs; both
// languages consume generated stubs (committed under shared-proto/gen/).
//
// Phase 2 fully wired up `IngestNow`. Phase 3 fleshes out the backtest RPCs:
//   - RunBacktest enqueues an Arq task and returns a handle synchronously.
//   - GetBacktestStatus reads the head doc from Mongo (state + metrics).
//   - StreamBacktestProgress is a server-streaming RPC backed by Redis Streams.
// Phase 4 (EvaluateSignal) and Phase 6 (StartOptimization) remain placeholders.

syntax = "proto3";

package quantpb.v1;

option go_package = "github.com/finance_next/shared-proto/gen/go/quantpb/v1;quantv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Quant is the gRPC contract exposed by the Python worker.
service Quant {
  // Phase 3: launch a vectorbt backtest run.
  rpc RunBacktest(BacktestRequest) returns (BacktestHandle);

  // Phase 3: poll a backtest run's progress / result summary.
  rpc GetBacktestStatus(GetBacktestStatusRequest) returns (BacktestStatus);

  // Phase 3: server-streaming live progress; one BacktestProgress per update.
  // Stream terminates when the run reaches a terminal state.
  rpc StreamBacktestProgress(GetBacktestStatusRequest) returns (stream BacktestProgress);

  // Phase 6: launch an Optuna study.
  rpc StartOptimization(OptimizationRequest) returns (StudyHandle);

  // Phase 6: poll a study's progress / cost ledger snapshot.
  rpc GetOptimizationStatus(StudyHandle) returns (OptimizationStatus);

  // Phase 6: server-streaming progress (one OptimizationProgress per update).
  // Stream terminates when the study reaches a terminal state.
  rpc StreamOptimizationProgress(StudyHandle) returns (stream OptimizationProgress);

  // Phase 2: synchronously trigger an OHLCV ingest range.
  // Implementation chunks the request via ccxt `since`+`limit` and upserts
  // into TimescaleDB's `ohlcv` hypertable using ON CONFLICT DO NOTHING.
  rpc IngestNow(IngestRequest) returns (IngestAck);

  // Phase 4: ask Python to evaluate a strategy signal for a given bar.
  rpc EvaluateSignal(EvaluateRequest) returns (SignalDecision);

  // AI-config introspection: returns the three static system prompts the
  // optimizer uses (define / refine / final-rationale), plus a content
  // hash + version label and the currently-resolved model family /
  // primary / refine model IDs after Mongo + env merge. Backs the
  // gateway's /admin/ai/prompts admin endpoint.
  rpc GetAIConfig(GetAIConfigRequest) returns (AIConfigResponse);
}

// ---- Phase 2 (IngestNow) ----------------------------------------------------

message IngestRequest {
  // Exchange identifier. Phase 2 supports: "binance", "okx", "bybit",
  // "ashare" (AKShare).
  string exchange = 1;
  // Trading symbol in exchange-native form, e.g. "BTCUSDT" for Binance USDT-M.
  // For ashare, this is a 6-digit ticker like "600519".
  string symbol = 2;
  // ccxt-style timeframe string: "1m" | "5m" | "1h" | "1d".
  string timeframe = 3;
  // Inclusive start timestamp of the requested ingest window.
  google.protobuf.Timestamp start = 4;
  // Exclusive end timestamp.
  google.protobuf.Timestamp end = 5;
}

message IngestAck {
  // Opaque server-assigned identifier for this ingest run; surface in logs.
  string run_id = 1;
  // Total number of OHLCV rows actually written (excludes ON CONFLICT skips).
  int64 bars_ingested = 2;
  // Earliest bar ts actually persisted (may differ from request start when
  // the exchange has no history that far back).
  google.protobuf.Timestamp from_ts = 3;
  // Latest bar ts persisted.
  google.protobuf.Timestamp to_ts = 4;
}

// ---- Phase 3 (RunBacktest / GetBacktestStatus / StreamBacktestProgress) ----

message BacktestRequest {
  // Mongo strategies._id (string form). Used to label results & for joins.
  string strategy_id = 1;
  // Strategy implementation discriminator (Phase 3 supports "grid_dca").
  string kind = 2;
  // Strategy-specific parameters as a structured JSON value. Keeping this
  // typed (Struct) instead of a raw string lets gateway pass-through stay
  // schema-light while still having a forwards-compatible wire format.
  google.protobuf.Struct params = 3;
  string symbol = 4;
  string exchange = 5;
  string timeframe = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;
  double initial_capital = 9;
  // Per-fill commission rate (e.g. 0.0004 for Binance taker). The Python
  // engine treats 0 as "use default = 0.0004".
  double commission_rate = 10;
  // Slippage in basis points (1 bp = 0.0001). Default is 1 (= 0.01%).
  double slippage_bps = 11;
}

message BacktestHandle {
  string run_id = 1;
  google.protobuf.Timestamp enqueued_at = 2;
}

message GetBacktestStatusRequest {
  string run_id = 1;
}

enum BacktestState {
  BACKTEST_STATE_UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
}

message BacktestStatus {
  string run_id = 1;
  BacktestState state = 2;
  // 0..1 progress fraction; only meaningful while RUNNING.
  double progress = 3;
  // Final / latest metrics. Keys: sharpe, sortino, max_dd, cagr, win_rate,
  // n_trades, total_return.
  map<string, double> metrics = 4;
  // Free-form error message when state == FAILED.
  string error_message = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

// Streaming payload — one message per progress update.
message BacktestProgress {
  string run_id = 1;
  double progress = 2;
  // Tail of the equity curve so the UI can update charts without re-fetching
  // the full series. Stream consumers can append to a ring buffer.
  repeated double recent_equity = 3;
  BacktestState state = 4;
  string error_message = 5;
}

// ---- Phase 6 (StartOptimization / GetOptimizationStatus / Stream) ----------

message OptimizationRequest {
  // Mongo strategies._id (string form). Required.
  string strategy_id = 1;
  // When true, run even if the strategy already has a recent recommendation.
  bool force = 2;
  // Optional override for trials cap; 0 means use AI_MAX_TRIALS_PER_STUDY.
  int32 n_trials_override = 3;
}

message StudyHandle {
  string study_id = 1;
  google.protobuf.Timestamp enqueued_at = 2;
}

enum OptimizationState {
  OPTIMIZATION_STATE_UNSPECIFIED = 0;
  OPT_PENDING = 1;
  OPT_RUNNING = 2;
  OPT_COMPLETED = 3;
  OPT_FAILED = 4;
  OPT_BUDGET_EXCEEDED = 5;
}

message OptimizationStatus {
  string study_id = 1;
  string strategy_id = 2;
  OptimizationState state = 3;
  int32 trials_completed = 4;
  int32 trials_total = 5;
  double best_value = 6;
  double current_cost_usd = 7;
  string error_message = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp finished_at = 10;
  // Recommendation id once published (Mongo `ai_recommendations._id`).
  string recommendation_id = 11;
}

// Streaming payload — emitted ~every 5 trials or on state change.
message OptimizationProgress {
  string study_id = 1;
  int32 trials_completed = 2;
  int32 trials_total = 3;
  double best_value = 4;
  OptimizationState state = 5;
  double current_cost_usd = 6;
  string error_message = 7;
}

// ---- Phase 4 placeholders (EvaluateSignal) ---------------------------------

message EvaluateRequest {
  string strategy_id = 1;
  string exchange = 2;
  string symbol = 3;
  string timeframe = 4;
  // Latest bar at which to evaluate (closed bar, no look-ahead).
  google.protobuf.Timestamp ts = 5;
}

// ---- AI config introspection -----------------------------------------------

message GetAIConfigRequest {}

message AIConfigResponse {
  // Three static system prompts the optimizer feeds the AI client. Sent
  // verbatim so the admin UI can render diffs against the in-repo copy.
  string define_search_space_prompt = 1;
  string refine_search_space_prompt = 2;
  string final_rationale_prompt = 3;
  // Coarse version label sourced from quant.ai.prompts.VERSION.
  string prompts_version = 4;
  // sha256 hex of the UTF-8 concatenation of the three prompts above;
  // lets the UI detect drift without diffing the full text.
  string prompts_hash = 5;
  // Currently-resolved model family ("claude" | "openai") after merging
  // the Mongo system_state.aiConfig override over the env defaults.
  string model_family_active = 6;
  // Resolved primary + refine model IDs for the active family.
  string primary_model_active = 7;
  string refine_model_active = 8;
}

message SignalDecision {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    HOLD = 1;
    OPEN_LONG = 2;
    OPEN_SHORT = 3;
    CLOSE = 4;
    ADD_POSITION = 5;
  }
  Action action = 1;
  // Optional sizing hint (fraction of allocated margin or qty).
  double size = 2;
  // Free-form rationale (logged for audit, surfaced in UI).
  string reason = 3;
}
