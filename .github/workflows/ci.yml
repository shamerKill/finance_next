name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  go:
    name: gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./cmd/gateway

  python:
    name: quant (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('quant/pyproject.toml') }}
      - name: uv sync
        run: uv sync --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q

  ts:
    name: client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock
      - name: install
        run: yarn install --frozen-lockfile
      - name: lint
        run: yarn lint
      - name: build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
        run: yarn build
