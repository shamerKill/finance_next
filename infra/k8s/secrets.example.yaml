# Example Secret manifest. DO NOT COMMIT REAL VALUES.
#
# Apply via:
#   kubectl create secret generic finance-next-secrets \
#     --from-literal=MONGODB_URI=... \
#     --from-literal=ENCRYPTION_KEY=... \
#     --from-literal=ADMIN_KEY=... \
#     --from-literal=TIMESCALE_USER=app \
#     --from-literal=TIMESCALE_PASSWORD=changeme \
#     -n finance-next
#
# All other manifests reference `finance-next-secrets` by name.
apiVersion: v1
kind: Secret
metadata:
  name: finance-next-secrets
  namespace: finance-next
type: Opaque
stringData:
  MONGODB_URI: "REPLACE_WITH_REAL_VALUE"
  ENCRYPTION_KEY: "REPLACE_WITH_REAL_64CHAR_HEX"
  ADMIN_KEY: "REPLACE_WITH_REAL_VALUE"
  TIMESCALE_USER: "app"
  TIMESCALE_PASSWORD: "REPLACE_WITH_REAL_VALUE"
  ANTHROPIC_API_KEY: ""
