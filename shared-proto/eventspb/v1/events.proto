// Copyright finance_next.
//
// Schemas for Redis Stream payloads. Redis itself is untyped (XADD takes
// arbitrary k/v field maps), but pinning a proto schema gives us a single
// place to evolve the wire format and lets producers/consumers serialize
// via the standard protobuf binary encoding (or JSON via protojson when
// human-debuggability matters more than throughput).

syntax = "proto3";

package eventspb.v1;

option go_package = "github.com/finance_next/shared-proto/gen/go/eventspb/v1;eventsv1";

import "google/protobuf/timestamp.proto";

// OhlcvIngested is emitted by the Python quant worker after a chunk of
// OHLCV rows has been persisted to TimescaleDB. Consumers (e.g. live
// strategy runtime in Phase 4) use this to know fresh data is available.
message OhlcvIngested {
  string exchange = 1;
  string symbol = 2;
  string timeframe = 3;
  google.protobuf.Timestamp from_ts = 4;
  google.protobuf.Timestamp to_ts = 5;
  int64 bars_ingested = 6;
  // Opaque ingest run id (matches IngestAck.run_id when triggered by RPC).
  string run_id = 7;
}

// StrategyUpserted is emitted by the Go gateway whenever a strategy is
// created or updated (including via approved AI recommendations).
// Phase 6 wires this; defined here so the wire format is locked in early.
message StrategyUpserted {
  string strategy_id = 1;
  // Monotonic version; see Mongo `strategies.currentVersion`.
  int64 version = 2;
  // Strategy kind discriminator (e.g. "grid_dca").
  string kind = 3;
}

// BacktestProgress is emitted by the Python quant worker during a backtest
// run, every ~10% of bars processed (or every 100 bars, whichever is more
// frequent). Consumed by the gateway WS hub and forwarded to subscribed
// browser sessions.
message BacktestProgress {
  string run_id = 1;
  // 0..1 progress fraction.
  double progress = 2;
  // Tail of the equity curve (most recent ~50 points). The full curve lives
  // in TimescaleDB; this is only for live UI updates.
  repeated double recent_equity = 3;
  // Mirror of quantpb.v1.BacktestState (kept as int to avoid cross-package
  // proto imports between event and rpc packages).
  int32 state = 4;
}

// OptimizationSuggested is emitted by the Python quant worker after a study
// has produced a pending_review recommendation. Consumed by the gateway WS
// hub and forwarded to subscribed browser sessions on the (kind=optimization,
// id=studyId) topic.
message OptimizationSuggested {
  string strategy_id = 1;
  string study_id = 2;
  string recommendation_id = 3;
  // Expected sharpe delta vs the current strategy params (proposed - current).
  double expected_sharpe_delta = 4;
}

// OptimizationProgress is emitted during an Optuna study run; useful for the
// "Tune now" live progress meter on the strategy detail page.
message OptimizationProgress {
  string study_id = 1;
  int32 trials_completed = 2;
  int32 trials_total = 3;
  double best_value = 4;
  // Mirror of quantpb.v1.OptimizationState (kept as int to avoid cross-package
  // proto imports between event and rpc packages).
  int32 state = 5;
  double current_cost_usd = 6;
  string error_message = 7;
}

// BacktestCompleted is emitted by the Python quant worker when a backtest
// reaches a terminal state (COMPLETED or FAILED). Consumers can use this to
// trigger downstream actions (e.g. AI recommendation re-evaluation).
message BacktestCompleted {
  string run_id = 1;
  string strategy_id = 2;
  // Final metrics; keys mirror BacktestStatus.metrics.
  map<string, double> metrics = 3;
  // Mirror of quantpb.v1.BacktestState (3 = COMPLETED, 4 = FAILED).
  int32 state = 4;
  string error_message = 5;
  google.protobuf.Timestamp finished_at = 6;
}
