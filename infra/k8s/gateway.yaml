apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: finance-next
data:
  PORT: "3001"
  TIMESCALE_DSN: "postgres://app@timescale.finance-next.svc:5432/finance?sslmode=disable"
  REDIS_URL: "redis://redis.finance-next.svc:6379/0"
  QUANT_GRPC_ADDR: "quant.finance-next.svc:50051"
  RATELIMIT_BACKEND: "redis"
  KEK_PROVIDER: "env"
  # Default OTel exporter is stdout — set OTEL_EXPORTER_OTLP_ENDPOINT
  # in the deployment env to ship traces to a collector.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: finance-next
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: finance-next
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: finance-next/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: finance-next-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
