# Production override — composes ON TOP of docker-compose.yml.
#
# Usage:
#   export DOMAIN=trading.example.com
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.prod.yml \
#     up -d
#
# Differences from base compose:
#   - Datastore ports (mongo / redis / timescale) NOT exposed to host —
#     only reachable via the internal docker network.
#   - Gateway / quant also NOT exposed — traffic enters via Caddy.
#   - restart: always (instead of unless-stopped) — auto-recover on host reboot.
#   - AUTH_COOKIE_SECURE=true on gateway (HTTPS-only cookies).
#   - OTEL_EXPORTER_OTLP_ENDPOINT optional pass-through.
#   - Caddy reverse proxy with automatic Let's Encrypt TLS.
#
services:
  mongo:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  timescale:
    ports: []
    restart: always

  gateway:
    ports: []
    restart: always
    environment:
      AUTH_COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: "https://${DOMAIN:-localhost}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  quant:
    ports: []
    restart: always

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
      args:
        # Default `/api` keeps the bundle same-origin so the browser sends
        # cookies; Caddy proxies /api/* to gateway. Override only when the
        # API is on a different host.
        NEXT_PUBLIC_API_URL: "/api"
    container_name: fn_client
    restart: always
    expose:
      - "3000"  # internal-only; Caddy reverse-proxies to it
    depends_on:
      gateway:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: fn_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
