[project]
name = "quant"
version = "0.1.0"
description = "finance_next Python quant worker — OHLCV ingest, backtests, optimization"
requires-python = ">=3.12"
readme = "README.md"

# Phase 2 deps + Phase 3 (motor for backtest head docs). Heavier libs
# (optuna, anthropic) land in later phases. We keep an in-house signals
# simulator instead of pulling vectorbt — vectorbt brings numba + tables +
# plotly, none of which we need; the simulator in strategies/base.py is
# ~80 LoC and exact for our grid_dca semantics.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.28",
    "arq>=0.26",
    "redis>=5.0",
    "ccxt>=4.4",
    "akshare>=1.15",
    "pandas>=2.2",
    "numpy>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "structlog>=24.4",
    # Phase 3: Mongo client for backtest head docs.
    "motor>=3.5",
    # Phase 6: Anthropic SDK + Optuna for the AI auto-optimization loop.
    # `anthropic` is only used by quant/ai/claude_client.py at study
    # boundaries; `optuna` powers the per-trial TPE sampler.
    "anthropic>=0.40",
    "optuna>=4.0",
    # Phase 8: extended data sources. yfinance pulls intl equities;
    # feedparser drives the generic RSS news aggregator. Everything
    # else (FRED, DefiLlama, Etherscan, blockchain.info, CryptoPanic)
    # rides on the existing httpx dependency.
    "yfinance>=0.2",
    "feedparser>=6.0",
    # Phase 9: Polymarket WS subscriber. We use the maintained
    # `websockets` library for its pure-Python client + clean async
    # iterator API — anyio/httpx-ws would also work but `websockets`
    # ships smaller wheels.
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.25",
    "ruff>=0.6",
]

# Mirror dev deps into uv's dependency-groups so `uv sync` installs them
# by default (PEP 735). This keeps `uv sync && uv run pytest -q` working
# without an extra flag.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.25",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

# The shared-proto generated Python stubs live one level up. Make them
# importable in editable installs by adding the path here.
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Quiet pandas/akshare deprecation noise that's irrelevant to our code.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
