[project]
name = "quant"
version = "0.1.0"
description = "finance_next Python quant worker — OHLCV ingest, backtests, optimization"
requires-python = ">=3.12"
readme = "README.md"

# Phase 2 deps. Heavier libs (vectorbt, optuna, anthropic) land in later phases.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.28",
    "arq>=0.26",
    "redis>=5.0",
    "ccxt>=4.4",
    "akshare>=1.15",
    "pandas>=2.2",
    "numpy>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.25",
    "ruff>=0.6",
]

# Mirror dev deps into uv's dependency-groups so `uv sync` installs them
# by default (PEP 735). This keeps `uv sync && uv run pytest -q` working
# without an extra flag.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.25",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

# The shared-proto generated Python stubs live one level up. Make them
# importable in editable installs by adding the path here.
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Quiet pandas/akshare deprecation noise that's irrelevant to our code.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
